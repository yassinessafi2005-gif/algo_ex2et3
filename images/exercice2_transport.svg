<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
  <title id="title">Plan de transport des conteneurs</title>
  <desc id="desc">D1 livre 3 conteneurs à M1 et 5 à M2. D2 livre 1 à M1 et 8 à M3. Coût total 52.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#527496"/></marker></defs>
  <rect width="900" height="430" rx="18" fill="#f7f9fc"/>
  <text x="450" y="42" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#18324b">Exercice 2 — Plan de livraison</text>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <g fill="#e5eef8" stroke="#50799e" stroke-width="2"><rect x="70" y="115" width="150" height="76" rx="14"/><rect x="70" y="250" width="150" height="76" rx="14"/></g>
    <g fill="#173b5e" font-size="20" font-weight="700"><text x="145" y="148">Dépôt D1</text><text x="145" y="174" font-size="15">capacité : 8</text><text x="145" y="283">Dépôt D2</text><text x="145" y="309" font-size="15">capacité : 9</text></g>
    <g fill="#eaf4ec" stroke="#57916b" stroke-width="2"><rect x="680" y="75" width="150" height="70" rx="14"/><rect x="680" y="180" width="150" height="70" rx="14"/><rect x="680" y="285" width="150" height="70" rx="14"/></g>
    <g fill="#24563a" font-size="19" font-weight="700"><text x="755" y="105">Magasin M1</text><text x="755" y="128" font-size="15">demande : 4</text><text x="755" y="210">Magasin M2</text><text x="755" y="233" font-size="15">demande : 5</text><text x="755" y="315">Magasin M3</text><text x="755" y="338" font-size="15">demande : 8</text></g>
  </g>
  <g fill="none" stroke="#527496" stroke-width="3" marker-end="url(#arrow)">
    <path d="M220 140 C380 95 510 95 680 108"/><path d="M220 160 C400 180 505 205 680 215"/><path d="M220 285 C400 210 530 145 680 120"/><path d="M220 300 C390 355 535 340 680 320"/>
  </g>
  <g font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#18324b" text-anchor="middle">
    <rect x="405" y="78" width="108" height="28" rx="8" fill="white"/><text x="459" y="98">3 conteneurs</text>
    <rect x="410" y="173" width="108" height="28" rx="8" fill="white"/><text x="464" y="193">5 conteneurs</text>
    <rect x="430" y="230" width="108" height="28" rx="8" fill="white"/><text x="484" y="250">1 conteneur</text>
    <rect x="425" y="330" width="108" height="28" rx="8" fill="white"/><text x="479" y="350">8 conteneurs</text>
  </g>
  <text x="450" y="400" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#18324b">Coût total : 52 unités monétaires</text>
</svg>
